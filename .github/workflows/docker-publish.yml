name: Docker Publish + FPK Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_NAME: ai-app-portal
  FPK_DIR: deploy/fpk
  FPK_OUT: dist/ai-app-portal.fpk

jobs:
  build_and_push_image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验 tag 与 package.json 版本一致（防止旧 tag 误构建覆盖镜像）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::git 标签 ($TAG) 与 package.json.version ($VER) 不一致，拒绝构建"
            exit 1
          fi
          echo "版本校验通过: $TAG"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据（tags / labels）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送多架构镜像（amd64 / arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_fpk:
    needs: build_and_push_image
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: 设置 Docker Buildx
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验已发布镜像存在
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${TAG}" >/dev/null

      - name: 版本一致性检查（tag = package.json = FPK 内 compose 应用镜像标签）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"

          # 仅校验本项目镜像的标签（依赖镜像不参与版本一致性）
          TAGS="$(
            grep -E '^[[:space:]]*image:' "${FPK_DIR}/fpk-root/app/docker/docker-compose.yaml" \
              | awk '{print $2}' \
              | sed 's/.*://'
          )"

          if [ -z "$TAGS" ]; then
            echo "::error::未在 docker-compose.yaml 中找到本项目镜像字段"
            exit 1
          fi

          UNIQ_COUNT="$(echo "$TAGS" | sort -u | wc -l | tr -d '[:space:]')"
          if [ "$UNIQ_COUNT" != "1" ]; then
            echo "::error::compose 中存在多个不同的应用镜像标签，请统一后重新打标签"
            echo "$TAGS"
            exit 1
          fi

          IMGTAG="$(echo "$TAGS" | head -1)"
          echo "tag=$TAG package.json=$VER image_tag=$IMGTAG"

          if [ "$TAG" != "$VER" ]; then
            echo "::error::git 标签 ($TAG) 与 package.json.version ($VER) 不一致"
            exit 1
          fi

          if [ "$IMGTAG" != "__VERSION__" ]; then
            echo "::error::fpk-root compose 模板应使用 __VERSION__ 占位符（当前: $IMGTAG）"
            exit 1
          fi

      - name: 冒烟测试（真实容器跑 /api/health）
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          docker run -d --rm --name aap-smoke -p 18080:8080 \
            -e ADMIN_INITIAL_PASSWORD=smoke-test-pass "${REGISTRY}/${IMAGE_NAME}:${TAG}"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/api/health | grep -q '"ok":true'; then
              echo "冒烟通过"
              docker rm -f aap-smoke >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error::冒烟失败：/api/health 未就绪"
          docker logs aap-smoke || true
          docker rm -f aap-smoke >/dev/null || true
          exit 1

      - name: 构建 .fpk 并生成校验和
        run: |
          mkdir -p dist
          bash "${FPK_DIR}/build-fpk.sh" "${GITHUB_REF_NAME#v}" "${REGISTRY}/${IMAGE_NAME}"
          cp "${FPK_DIR}/dist/ai-app-portal_${GITHUB_REF_NAME#v}.fpk" "${FPK_OUT}"
          (cd dist && sha256sum ai-app-portal.fpk > SHA256SUMS.txt)
          ls -l dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ai-app-portal-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: 附着到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ai-app-portal.fpk
            dist/SHA256SUMS.txt
          body: |
            ## AI应用门户

            自托管 AI 应用网关 + 门户：统一入口 / 自动 HTTPS / 登录鉴权 / 主题品牌 / LLM 网关（M2）/ 计费（M3）。

            ## 部署方式

            - **Docker 多架构镜像**（amd64/arm64）：
              ```
              docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
              ```
            - **飞牛 fnOS 应用**：下载本 Release 附带的 `ai-app-portal.fpk`，在应用中心手动安装；校验和见 `SHA256SUMS.txt`

            安装完成后，管理员初始密码打印在容器日志中（`docker logs ai-app-portal`），登录后请立即修改密码并绑定 MFA。
