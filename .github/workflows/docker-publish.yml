name: Docker Publish + FPK Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_NAME: ai-app-portal

jobs:
  # 审计建议（2026-09-16 §8）：CI 固定 Node 版本跑全量测试；测试本身即
  # better-sqlite3 原生模块加载冒烟（setupTestDb 直接实例化）
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 固定 Node 22（与 Dockerfile 运行时一致）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm 11
        run: npm i -g pnpm@11

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: typecheck + 全量测试
        run: |
          pnpm -r typecheck
          pnpm -r test

  build_and_push_image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验 tag 与 package.json 版本一致（防止旧 tag 误构建覆盖镜像）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::git 标签 ($TAG) 与 package.json.version ($VER) 不一致，拒绝构建"
            exit 1
          fi
          echo "版本校验通过: $TAG"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据（tags / labels）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送多架构镜像（amd64 / arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试（真实容器跑 /api/health，amd64 单架构）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          docker run -d --rm --name aap-smoke -p 18080:8080 \
            -e ADMIN_INITIAL_PASSWORD=smoke-test-pass "${REGISTRY}/${IMAGE_NAME}:${TAG}"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/api/health | grep -q '"ok":true'; then
              echo "冒烟通过"
              docker rm -f aap-smoke >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error::冒烟失败：/api/health 未就绪"
          docker logs aap-smoke || true
          docker rm -f aap-smoke >/dev/null || true
          exit 1

  build_fpk:
    # 原生 FPK（载荷 = deploy/native 自包含包），与镜像发布解耦：
    # 包内自带 glibc Node 22 与目标架构 better-sqlite3，安装不依赖任何镜像拉取。
    needs: test
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: x86
          - arch: arm64
            platform: arm
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 固定 Node 22（与原生包运行时一致）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm 11
        run: npm i -g pnpm@11

      - name: 安装依赖（前端按网关前缀重建需要）
        run: pnpm install --frozen-lockfile

      - name: 设置 QEMU（arm64 原生构建用）
        uses: docker/setup-qemu-action@v3

      - name: 构建原生自包含包（glibc Node 22 + 目标 C 库 better-sqlite3）
        run: ./deploy/native/build-native.sh linux/${{ matrix.arch }}

      - name: 校验 tag 与 package.json 一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::git 标签 ($TAG) 与 package.json.version ($VER) 不一致，拒绝打包"
            exit 1
          fi

      - name: 打包 FPK（原生形态，统一网关入口）
        run: |
          set -e
          VER="$(node -p "require('./package.json').version")"
          bash deploy/fpk/build-fpk.sh "$VER" ${{ matrix.platform }}
          mkdir -p dist
          cp "deploy/fpk/dist/ai-app-portal_${VER}_${{ matrix.platform }}.fpk" dist/
          (cd dist && sha256sum "ai-app-portal_${VER}_${{ matrix.platform }}.fpk" > "SHA256SUMS_${{ matrix.platform }}.txt")
          ls -l dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release_fpk:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build_fpk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 汇集双架构 FPK
        uses: actions/download-artifact@v4
        with:
          pattern: fpk-*
          merge-multiple: true
          path: dist

      - name: 附着到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.fpk
            dist/SHA256SUMS_*.txt
          body: |
            ## AI应用门户

            解决 agent 写完代码之后的「下一站」：agent 生成的网页 / 小工具 / Python 应用按 .neon-aap 规范一键上架，他人点开即用，无需装环境。自托管 AI 应用网关 + 门户：统一入口 / 自动 HTTPS / 登录鉴权 / 主题品牌 / LLM 网关 / 计费。

            ## 部署方式

            - **飞牛 fnOS（原生 FPK）**：按设备架构下载 `ai-app-portal_<版本>_x86.fpk`（x86 设备）或 `ai-app-portal_<版本>_arm.fpk`（ARM 设备），应用中心手动安装；校验和见 `SHA256SUMS_*.txt`。桌面图标经统一网关进入，业务鉴权由门户自带账号体系完成；管理员初始密码在应用数据目录 `app.log`（TRIM_PKGVAR），登录后请立即改密并绑定 MFA。
            - **Docker 多架构镜像**（amd64/arm64，非飞牛环境）：
              ```
              docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
              ```
              管理员初始密码打印在容器日志（`docker logs`）。
