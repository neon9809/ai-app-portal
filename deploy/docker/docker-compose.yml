# AI应用门户 — Docker Compose
# 用法：cd deploy/docker && docker compose up -d
# 数据在 ../data（SQLite、证书、密钥）；首次启动看日志获取初始管理员密码：
#   docker compose logs | grep -A4 "初始管理员凭据"
name: ai-app-portal

services:
  portal:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    # 本地构建镜像；正式部署改为拉取发布镜像：
    #   image: ghcr.io/neon9809/ai-app-portal:latest（CI 随 tag 自动发布多架构）
    image: ai-app-portal:latest
    container_name: ai-app-portal
    restart: unless-stopped
    ports:
      - "80:8080"     # 业务入口（门户 + /app/<id>/ 应用网关 + ACME HTTP-01 挑战）
      - "443:8443"    # HTTPS（配置证书后启用）
    volumes:
      - ../../data:/data
      # 纯门户模式（反代外置给 Caddy/nginx）时不需要暴露 8443
    environment:
      TRUST_PROXY: "0"           # 有前置反代（nginx/Caddy）时改为 1
      # .neon-aap Python 运行时入口：容器内 REPO_ROOT 推导失效（代码在 /out），
      # 必须显式指定，否则所有 Python 包执行报 runner.py 缺失
      AAP_RUNNER: "/out/aap-sdk/aap_runtime/runner.py"
      # 官方发布者公钥预置（每次启动自动种入信任列表，builtin 不可删——
      # 该 key 签名的 .neon-aap 包上传即 verified 免审；私钥由发布者线下保管）
      AAP_OFFICIAL_SIGN_PUBKEY: "TZxb0LoJihvn7d0c+9D6dVY3BgbhpCUAjZiWgMw7AnE="
      AAP_OFFICIAL_SIGNER_NAME: "neon9809"
      # 沙箱降权（默认开启）：Python 包进程以预建非特权用户 aap(10001) 运行。
      # 存量部署升级时需一次性迁移数据卷属主：chown -R 10001:10001 ../data/appsites
      # （开放注册 + 允许用户上传包的部署必须启用，否则任意注册用户可读全站凭据哈希）
      SANDBOX_UID: "10001"
      SANDBOX_GID: "10001"
      # 进一步加固（可选）：以非 root 运行主进程（注意先把数据卷属主改为 10001:10001）
      # user: "10001:10001"
      # 初始管理员密码（仅首启生效；不填则随机生成并打印到日志）
      # ADMIN_INITIAL_PASSWORD: ""
      # 数据库（默认 SQLite；FPK/外部库场景示例）：
      # DATABASE_URL: "mysql://user:pass@mariadb:3306/ai_app_portal"
